<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="title">Portfolio</title>

    <!-- font awesome cdn link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">

    <!-- custom css file link  -->
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
<!-- header section starts  -->

<header>
    <div class="language-switcher">
        <button class="btn" onclick="setLanguage('vi')">Vie</button>
        <button class="btn" onclick="setLanguage('en')">Eng</button>
    </div>
    
<div class="user">
    <div class="profile-img">
        <img src="images/profile.jpg" alt="Profile Picture">
    </div>
        <h3 id="userName" class="name"></h3>
        <h3 id="userNick" class="nickname"></h3>
        <p id="userPosition" class="post"></p>
    </div>

    <nav class="navbar">
        <ul>
            <li><a id="navHome" href="#home"></a></li>
            <li><a id="navAbout" href="#about"></a></li>
            <li><a id="navExperience" href="#experience"></a></li>
            <li><a id="navPortfolio" href="#portfolio"></a></li>
            <li><a id="navContact" href="#contact"></a></li>
        </ul>
    </nav>
</header>

<div id="menu" class="fas fa-bars"></div>

<section class="home" id="home">
    <h3 id="homeHello"></h3>
    <h1><span id="homeTitle"></span></h1>
    <p id="homeDesc"></p>
    <a href="#about"><button class="btn" id="homeBtn"></button></a>
</section>

<section class="about" id="about">
    <h1 class="heading" id="aboutHeading"></h1>

    <div class="row">
        <div class="info">
            <h3><span id="aboutNameLabel"></span> <span id="aboutName"></span></h3>
            <h3><span id="aboutAgeLabel"></span> <span id="aboutAge"></span></h3>
            <h3><span id="aboutQualiLabel"></span> <span id="aboutQuali"></span></h3>
            <h3><span id="aboutPostLabel"></span> <span id="aboutPost"></span></h3>
            <h3><span id="aboutLangLabel"></span> <span id="aboutLang"></span></h3>
            <a href="https://www.facebook.com/tanhtanhHR">
                <button class="btn" >
                            <i class="fab fa-facebook-f"></i>
                </button>
            </a>
            <a href="https://www.linkedin.com/in/anh-nguyen-tuan-3b2b94116/">
                <button class="btn" >
                            <i class="fab fa-linkedin-in"></i>
                </button>
            </a>
            <a href="https://zalo.me/0904178382" target="_blank">
            <button class="btn">
                <img src="images/Zalo_logo_2019.svg.png" alt="Zalo Logo" height="15" style="filter: brightness(0) invert(1);">
            </button>
            </a>

        </div>

        <div class="counter">
            <div class="box">
                <span id="expYears"></span>
                <h3 id="expText"></h3>
            </div>

            <div class="box">
                <span id="expProject"></span>
                <h3 id="expProjectText"></h3>
            </div>

            <div class="box">
                <span id="expClients"></span>
                <h3 id="expClientsText"></h3>
            </div>

            <div class="box">
                <span id="expAwards"></span>
                <h3 id="expAwardsText"></h3>
            </div>
        </div>
    </div>
</section>

<section class="experience" id="experience">
    <h1 class="heading" id="expHeading"></h1>

    <div class="box-container">

        <div class="box">
            <i class="fas fa-award"></i>
            <span id="exp1Year"></span>
            <h3 id="exp1Title"></h3>
            <p id="exp1Desc"></p>
        </div>

        <div class="box">
            <i class="fas fa-award"></i>
            <span id="exp2Year"></span>
            <h3 id="exp2Title"></h3>
            <p id="exp2Desc" class="expDesc"></p>
        </div>

        <div class="box">
            <i class="fas fa-award"></i>
            <span id="exp3Year"></span>
            <h3 id="exp3Title"></h3>
            <p id="exp3Desc"></p>
        </div>

        <div class="box">
            <i class="fas fa-award"></i>
            <span id="exp4Year"></span>
            <h3 id="exp4Title"></h3>
            <p id="exp4Desc"></p>
        </div>

        <div class="box">
            <i class="fas fa-award"></i>
            <span id="exp5Year"></span>
            <h3 id="exp5Title"></h3>
            <p id="exp5Desc"></p>
        </div>

        <div class="box">
            <i class="fas fa-award"></i>
            <span id="exp6Year"></span>
            <h3 id="exp6Title"></h3>
            <p id="exp6Desc"></p>
        </div>

    </div>
</section>

<section class="portfolio" id="portfolio">
    <h1 class="heading" id="portHeading"></h1>

    <div class="box-container">
        <div class="box"><img src="images/1.jpeg"></div>
        <div class="box"><img src="images/2.jpg"></div>
        <div class="box"><img src="images/3.jpg"></div>
        <div class="box"><img src="images/4.jpg"></div>
        <div class="box"><img src="images/5.png"></div>
        <div class="box"><img src="images/6.jpg"></div>
    </div>
</section>

<section class="contact" id="contact">
    <h1 class="heading" id="contactHeading"></h1>

    <div class="row">

        <div class="content">
            <h3 class="title" id="contactTitle"></h3>

            <div class="info">
                <h3 class="lower"><i class="fas fa-envelope"></i> <span id="contactEmail"></span></h3>
                <h3><i class="fas fa-phone"></i> <span id="contactPhone1"></span></h3>
                <h3><i class="fas fa-phone"></i> <span id="contactPhone2"></span></h3>
                <h3><i class="fas fa-map-marker-alt"></i> <span id="contactAddress"></span></h3>
            </div>
        </div>

        <form>
            <input id="contactName" type="text" class="box" placeholder="name" >
            <input id="contactMail" type="email" class="box" placeholder="email">
            <input id="contactProject" type="text" class="box" placeholder="project">
            <textarea id="contactMessage" cols="30" rows="10" class="box message" placeholder="message"></textarea>
            <button type="submit" class="btn" id="contactBtn"></button>
        </form>

    </div>
</section>

<a href="#home" class="top">
    <img src="images/scroll.png" alt="Scroll For Top">
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="js/lang.js"></script>
<script src="js/script.js"></script>
<script src="https://cdn.emailjs.com/dist/email.min.js"></script>
<script>
   (function(){
       emailjs.init("tuananhnguyen.hr@gmail.com"); // thay YOUR_USER_ID bằng ID EmailJS của bạn
   })();
</script>
</body>
</html>
